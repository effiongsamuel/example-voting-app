apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test"
  labels:
    {{- include "voting.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - >-
          curl -fsS --max-time 10 http://vote:{{ .Values.vote.service.port }}/ >/dev/null &&
          curl -fsS --max-time 10 http://result:{{ .Values.result.service.port }}/ >/dev/null
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
