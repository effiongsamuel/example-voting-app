name: Publish images

# Manual and minimal: builds the three images and pushes them to GHCR (tagged with the commit SHA and latest).
# No tests, no scans, so nothing can block the first publication. Run it from Actions > Publish images > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v7

      - name: Registry path must be lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/example-voting-app-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/example-voting-app-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  check-public:
    name: Check that the images can be pulled without a login
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous pull (this is what the server does)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          failed=0
          for s in vote result worker; do
            if docker pull "ghcr.io/${owner}/example-voting-app-${s}:latest" > /dev/null 2>&1; then
              echo "OK      ghcr.io/${owner}/example-voting-app-${s}:latest"
            else
              echo "::error::ghcr.io/${owner}/example-voting-app-${s} is private. Open it under your profile > Packages > Package settings > Change visibility > Public."
              failed=1
            fi
          done
          exit "$failed"