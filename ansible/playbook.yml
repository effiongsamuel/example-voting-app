---
# Run automatically by Terraform (terraform/ansible.tf), or by hand from this folder:
#   ansible-playbook playbook.yml -e @vars.generated.yml
# Safe to re-run. deploy_method (from Terraform) is compose, k3s or both.

# 1. Wait for the server and install Docker ------------------------------------
- name: Prepare the server
  hosts: voting
  become: true
  gather_facts: false
  tasks:
    - name: Wait until SSH works (a new server needs a minute or two)
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 900

    - name: Gather facts
      ansible.builtin.setup:

    - name: Wait for first-boot cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install Docker, the compose plugin and tools
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, curl, ca-certificates]
        update_cache: true
        lock_timeout: 300

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

# 1b. Stop early, with a clear message, if the images cannot be pulled ------------
- name: Check that the application images can be pulled
  hosts: voting
  become: true
  gather_facts: false
  tasks:
    - name: Try to pull each image
      ansible.builtin.command: "docker pull {{ item }}"
      loop:
        - "{{ vote_image }}"
        - "{{ result_image }}"
        - "{{ worker_image }}"
      register: image_pull
      failed_when: false
      changed_when: false

    - name: Stop with an explanation if an image cannot be pulled
      ansible.builtin.fail:
        msg: >-
          Cannot pull: {{ image_pull.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}.
          "denied" means the image does not exist yet or the package is private. Fix: (1) push a change in
          vote/, result/ or worker/ to main and wait until the CI-CD workflow is green, (2) on GitHub open
          Your profile > Packages, and set each example-voting-app-* package to Public, (3) check that
          github_owner in terraform/terraform.tfvars is your GitHub name (the name must match the package
          path above), then run this workflow again.
      when: (image_pull.results | selectattr('rc', 'ne', 0) | list | length) > 0

# 2. Docker Compose first (so Docker's networks exist before k3s starts) ---------
- name: Deploy with Docker Compose
  hosts: voting
  become: true
  gather_facts: false
  tasks:
    - name: Run the compose tasks
      ansible.builtin.include_tasks: tasks/deploy_compose.yml
      when: deploy_method in ['compose', 'both']

# 3. k3s, with the app installed by the Helm chart in helm/voting-app/ ---------------
- name: Deploy with k3s
  hosts: voting
  become: true
  gather_facts: false
  tasks:
    - name: Run the k3s tasks
      ansible.builtin.include_tasks: tasks/deploy_k3s.yml
      when: deploy_method in ['k3s', 'both']

# 4. Summary ------------------------------------------------------------------
- name: Summary
  hosts: voting
  gather_facts: false
  tasks:
    - name: Docker Compose URLs
      ansible.builtin.debug:
        msg:
          - "Vote:   http://{{ public_ip }}:{{ vote_port }}"
          - "Result: http://{{ public_ip }}:{{ result_port }}"
      when: deploy_method in ['compose', 'both']

    - name: k3s URLs
      ansible.builtin.debug:
        msg:
          - "Vote (k3s):   http://{{ public_ip }}:{{ k3s_vote_nodeport }}"
          - "Result (k3s): http://{{ public_ip }}:{{ k3s_result_nodeport }}"
      when: deploy_method in ['k3s', 'both']
